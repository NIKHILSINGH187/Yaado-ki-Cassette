
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>यादों की कैसेट — Yaado Ki Cassette</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D9AE5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brass:#D9AE5C;
    --paper:#F1E4C9;
    --glass-bg:rgba(20,14,8,0.42);
    --glass-border:rgba(241,228,201,0.18);
    --green:#3FBF63;
    --red:#E23B3B;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html, body{
    height:100%;
    font-family:'IBM Plex Mono', monospace;
    color:var(--paper);
  }

  .stage{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 24px 28px;
  }

  /* ===== HERO IMAGE (full quality, no CSS scaling artifacts) ===== */
  .hero-link{
    position:absolute;
    inset:0;
    z-index:0;
    display:block;
  }
  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    /* keeps the browser from softening the image when scaling */
    image-rendering:auto;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background-image:
      linear-gradient(180deg, rgba(15,10,6,0.55) 0%, rgba(15,10,6,0.05) 22%, rgba(15,10,6,0.05) 60%, rgba(10,7,4,0.75) 100%);
  }
  .stage > *:not(.hero-link):not(.hero-overlay){
    position:relative;
    z-index:2;
  }
  .tap-hint{
    position:absolute;
    bottom:10px;
    right:14px;
    z-index:2;
    font-size:10px;
    opacity:0.55;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    padding:4px 9px;
    border-radius:10px;
    pointer-events:none;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:12px;
  }

  .clock{
    font-size:15px;
    letter-spacing:0.08em;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(6px);
    padding:8px 14px;
    border-radius:8px;
  }

  .live-count{
    position:absolute;
    top:22px; left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(6px);
    padding:7px 16px;
    border-radius:20px;
    z-index:2;
  }
  .live-count .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .top-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
  }

  .stream-links{
    display:flex;
    gap:8px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--glass-border);
    backdrop-filter:blur(6px);
    cursor:pointer;
    text-decoration:none;
    color:var(--paper);
  }
  .pill.spotify{ background:rgba(30,215,96,0.18); }
  .pill.ytmusic{ background:rgba(255,0,0,0.18); }
  .pill svg{ width:14px; height:14px; }

  .nav-links{
    display:flex;
    gap:8px;
  }
  .nav-btn{
    font-size:12px;
    padding:8px 14px;
    border-radius:20px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(6px);
    cursor:pointer;
    color:var(--paper);
    display:flex; align-items:center; gap:6px;
  }
  .nav-btn svg{ width:13px; height:13px; }

  /* ===== FLOATING NOTIFICATION CARDS ===== */
  .notifications{
    align-self:center;
    display:flex;
    flex-direction:column;
    gap:10px;
    width:min(430px, 90vw);
    margin-bottom:16px;
  }

  .notif-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:12px 14px;
  }
  .notif-icon{
    width:34px; height:34px;
    border-radius:8px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .notif-icon.wa{ background:#25D366; }
  .notif-icon.app{ background:var(--brass); color:#241a10; font-family:'Special Elite',monospace; font-weight:700; font-size:13px; }

  .notif-text{ flex:1; min-width:0; }
  .notif-text .t1{ font-size:12.5px; font-weight:600; }
  .notif-text .t2{ font-size:10.5px; opacity:0.65; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .notif-action{
    font-size:11px;
    font-weight:600;
    padding:6px 12px;
    border-radius:16px;
    background:var(--green);
    color:#0f1a10;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .notif-action.install{ background:var(--brass); color:#241a10; }
  .notif-close{
    background:none; border:none; color:var(--paper);
    opacity:0.5; cursor:pointer; font-size:14px; flex-shrink:0;
  }

  /* ===== PLAYER BAR ===== */
  .player-wrap{
    align-self:center;
    width:min(560px, 94vw);
  }

  .yt-player-frame{
    width:100%;
    aspect-ratio:16/9;
    max-height:320px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:blur(12px);
  }

  .player-bar{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:12px 18px;
  }

  .cover{
    width:44px; height:44px;
    border-radius:8px;
    background:linear-gradient(135deg, #C97B4A, #5E6E3F);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }

  .track-meta{
    min-width:0;
    width:118px;
    flex-shrink:0;
  }
  .track-meta .name{
    font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-meta .artist{
    font-size:10.5px; opacity:0.6; margin-top:2px;
  }

  .transport{
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .transport button{
    background:none; border:none; color:var(--paper); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:4px;
  }
  .transport svg{ width:16px; height:16px; }
  .transport .play-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--paper);
    color:#241a10;
  }
  .transport .play-btn svg{ width:14px; height:14px; }

  .progress-wrap{
    flex:1;
    min-width:60px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .scrub-track{
    flex:1;
    height:4px;
    background:rgba(241,228,201,0.2);
    border-radius:2px;
    cursor:pointer;
    position:relative;
  }
  .scrub-fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:var(--brass);
    border-radius:2px;
  }
  .time{
    font-size:10.5px;
    opacity:0.7;
    white-space:nowrap;
    flex-shrink:0;
  }

  .vol{
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .vol svg{ width:14px; height:14px; opacity:0.75; }
  .vol-slider{
    -webkit-appearance:none;
    width:60px; height:3px;
    background:rgba(241,228,201,0.2);
    border-radius:2px;
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--brass);
    cursor:pointer;
  }

  .browse-panel{
    display:none;
    align-self:center;
    width:min(430px, 90vw);
    max-height:260px;
    overflow-y:auto;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .browse-panel.open{ display:block; }
  .browse-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; font-weight:600;
    padding-bottom:8px;
    border-bottom:1px dashed var(--glass-border);
    margin-bottom:6px;
  }
  .browse-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 2px;
    font-size:12px;
    cursor:pointer;
    border-bottom:1px dashed rgba(241,228,201,0.1);
  }
  .browse-row:last-child{ border-bottom:none; }
  .browse-row:hover{ opacity:0.75; }
  .browse-row .bnum{ opacity:0.5; width:16px; flex-shrink:0; }
  .browse-row .bname{ flex:1; }
  .browse-row .blen{ opacity:0.5; font-size:10.5px; }

  .contact-line{
    text-align:center;
    font-size:10.5px;
    opacity:0.55;
    margin-top:14px;
  }

  @media (max-width: 640px){
    .live-count{ position:static; transform:none; margin:10px auto 0; }
    .topbar{ justify-content:center; }
    .top-right{ align-items:center; }
    .player-bar{ flex-wrap:wrap; justify-content:center; }
    .track-meta{ width:auto; order:1; }
    .cover{ order:0; }
    .transport{ order:2; }
    .progress-wrap{ order:3; width:100%; }
    .vol{ order:4; }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Tapping/clicking anywhere on the background opens the full-resolution
       source image in a new tab, on desktop AND mobile. -->
  <a class="hero-link" href="assets/hero-bg.png" target="_blank" rel="noopener" aria-label="Open full resolution background image">
    <img class="hero-img" src="assets/hero-bg.png" alt="Yaado Ki Cassette background" loading="eager" decoding="async">
  </a>
  <div class="hero-overlay"></div>
  <div class="tap-hint">tap image for full quality</div>

  <div class="topbar">
    <div class="clock" id="clock">10:16 PM</div>

    <div class="live-count">
      <span class="dot"></span>
      <span id="onlineCount">306</span> online
    </div>

    <div class="top-right">
      <div class="stream-links">
        <a class="pill spotify" id="spotifyLink" href="https://open.spotify.com/search/yaado%20ki%20cassette" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.4c-.19.3-.58.4-.88.2-2.4-1.47-5.43-1.8-9-.98-.34.08-.69-.13-.77-.47-.08-.34.13-.69.47-.77 3.9-.89 7.24-.51 9.93 1.13.3.19.4.58.25.89zm1.22-2.72c-.24.37-.72.49-1.09.26-2.75-1.69-6.94-2.18-10.2-1.19-.42.13-.86-.11-.99-.53-.13-.42.11-.86.53-.99 3.72-1.13 8.35-.58 11.5 1.36.37.23.49.72.25 1.09zm.1-2.83C14.9 8.9 9.15 8.7 5.79 9.71c-.5.15-1.03-.13-1.18-.63-.15-.5.13-1.03.63-1.18 3.86-1.17 10.2-.94 14.24 1.46.45.27.6.85.33 1.3-.27.45-.85.6-1.3.33z"/></svg> Spotify</a>
        <a class="pill ytmusic" id="ytMusicLink" href="https://music.youtube.com/search?q=yaado%20ki%20cassette" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM9.5 16.5v-9l7 4.5-7 4.5z"/></svg> YT Music</a>
      </div>
      <div class="nav-links">
        <button class="nav-btn" id="playlistsBtn">Playlists</button>
        <button class="nav-btn" id="songsBtn">Songs</button>
        <button class="nav-btn" id="installBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg> Install</button>
      </div>
    </div>
  </div>

  <div class="notifications">
    <div class="notif-card">
      <div class="notif-icon wa">🟢</div>
      <div class="notif-text">
        <div class="t1">Get new songs before everyone else</div>
        <div class="t2">Join the Yaado crew on WhatsApp — fresh drops daily</div>
      </div>
      <button class="notif-action" id="joinFreeBtn">Join Free</button>
      <button class="notif-close" id="notif1Close">✕</button>
    </div>
    <div class="notif-card" id="installCard">
      <div class="notif-icon app">YK</div>
      <div class="notif-text">
        <div class="t1">Install Yaado Ki Cassette</div>
        <div class="t2">One tap install, no app store</div>
      </div>
      <button class="notif-action install" id="installCardBtn">Install</button>
      <button class="notif-close" id="notif2Close">✕</button>
    </div>
  </div>

  <!-- Real embedded YouTube playlist player — "yaado ki Cassette" (92 videos) -->
  <div class="player-wrap">
    <div class="yt-player-frame">
      <iframe
        id="ytPlayer"
        width="100%"
        height="100%"
        src="https://www.youtube.com/embed/videoseries?list=PLPcvPJDN5yKI&autoplay=0"
        title="Yaado Ki Cassette Radio"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <div class="contact-line">contact: nikhilsingh.cse07@gmail.com</div>
  </div>

</div>

<script>
  // live clock
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    document.getElementById('clock').textContent = h + ':' + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);

  // gently drifting online count, for atmosphere only
  const onlineEl = document.getElementById('onlineCount');
  let online = 306;
  setInterval(() => {
    online += Math.floor(Math.random()*5) - 2;
    if(online < 250) online = 250;
    onlineEl.textContent = online;
  }, 4000);

  // ===== PLAYLISTS / SONGS — both open the real YouTube playlist =====
  const YT_PLAYLIST_URL = 'https://www.youtube.com/playlist?list=PLPcvPJDN5yKI';
  const playlistsBtn = document.getElementById('playlistsBtn');
  const songsBtn = document.getElementById('songsBtn');
  playlistsBtn.addEventListener('click', () => window.open(YT_PLAYLIST_URL, '_blank'));
  songsBtn.addEventListener('click', () => window.open(YT_PLAYLIST_URL, '_blank'));

  // ===== NOTIFICATION CARD BUTTONS =====
  document.getElementById('notif1Close').addEventListener('click', (e) => {
    e.target.closest('.notif-card').style.display = 'none';
  });
  document.getElementById('notif2Close').addEventListener('click', (e) => {
    e.target.closest('.notif-card').style.display = 'none';
  });

  // WhatsApp group invite link
  document.getElementById('joinFreeBtn').addEventListener('click', () => {
    window.open('https://chat.whatsapp.com/EMituq2F5HLGZnK8CxME5d', '_blank');
  });

  // ===== REAL PWA INSTALL (works once hosted on HTTPS with manifest.json + sw.js) =====
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const installCardBtn = document.getElementById('installCardBtn');
  const installCard = document.getElementById('installCard');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  async function triggerInstall(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if(choice.outcome === 'accepted') installCard.style.display = 'none';
    } else {
      alert('Install isn\'t available yet — this page needs to be hosted on HTTPS with a manifest.json and service worker for the native install prompt to appear. Ask me to set that up when you\'re ready to deploy.');
    }
  }

  installBtn.addEventListener('click', triggerInstall);
  installCardBtn.addEventListener('click', triggerInstall);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
