<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0a1224"/>
      <stop offset="80%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#18233f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e4d9b9" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#111a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trainFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151a24"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd56b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="1920" height="1080" fill="url(#nightSky)"/>

  <!-- Twinkling Starfield -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="240" cy="120" r="1.5"/>
    <circle cx="480" cy="80" r="1.2"/>
    <circle cx="720" cy="190" r="1.8"/>
    <circle cx="950" cy="110" r="1.5"/>
    <circle cx="1180" cy="70" r="1.4"/>
    <circle cx="1400" cy="150" r="2.0"/>
    <circle cx="1650" cy="100" r="1.3"/>
    <circle cx="350" cy="280" r="1.6"/>
    <circle cx="820" cy="260" r="1.2"/>
    <circle cx="1290" cy="220" r="1.7"/>
    <circle cx="1520" cy="290" r="1.4"/>
  </g>

  <!-- Crescent Moon with Misty Glow -->
  <circle cx="1380" cy="180" r="90" fill="url(#moonGlow)"/>
  <circle cx="1380" cy="180" r="32" fill="#fffbee"/>
  <circle cx="1394" cy="174" r="28" fill="#0b1325"/>

  <!-- Distant Indian Countryside Hills & Passing Station Lamp -->
  <path d="M0,640 Q380,560 760,600 T1520,580 T1920,620 L1920,880 L0,880 Z" fill="#080c16" opacity="0.9"/>
  <!-- Telegraph poles rushing past -->
  <line x1="500" y1="580" x2="500" y2="760" stroke="#04060a" stroke-width="5"/>
  <line x1="470" y1="620" x2="530" y2="620" stroke="#04060a" stroke-width="3"/>
  <line x1="1200" y1="570" x2="1200" y2="760" stroke="#04060a" stroke-width="5"/>
  <line x1="1170" y1="610" x2="1230" y2="610" stroke="#04060a" stroke-width="3"/>

  <!-- Distant Warm Rural Station Light -->
  <circle cx="1620" cy="620" r="18" fill="#ffb703" opacity="0.6"/>
  <circle cx="1620" cy="620" r="5" fill="#fff"/>

  <!-- Train Window Silhouette & Warm Berth Light -->
  <rect width="1920" height="1080" fill="url(#trainFrame)" mask="url(#trainWindowMask)"/>
  
  <!-- Outer Window Frame Architecture (Indian Railway Blue & Steel) -->
  <!-- Top Berth Roof -->
  <rect x="0" y="0" width="1920" height="160" fill="#090d14"/>
  <!-- Side Panels -->
  <rect x="0" y="160" width="280" height="920" fill="#090d14"/>
  <rect x="1640" y="160" width="280" height="920" fill="#090d14"/>
  <!-- Bottom Berth Sill / Table -->
  <rect x="0" y="780" width="1920" height="300" fill="#0c111a"/>
  <rect x="240" y="760" width="1440" height="30" fill="#1e2736" rx="6"/>

  <!-- The Classic 3 Steel Window Bars (Indian Sleeper Window) -->
  <line x1="280" y1="360" x2="1640" y2="360" stroke="#3b485d" stroke-width="7" opacity="0.7"/>
  <line x1="280" y1="520" x2="1640" y2="520" stroke="#3b485d" stroke-width="7" opacity="0.7"/>
  <line x1="280" y1="680" x2="1640" y2="680" stroke="#3b485d" stroke-width="7" opacity="0.7"/>

  <!-- Warm Berth Reading Lamp Glow on Sill -->
  <rect x="280" y="660" width="1360" height="120" fill="url(#windowGlow)"/>

  <!-- Vintage Transistor Radio Silhouette on Table -->
  <g transform="translate(380, 680)">
    <rect x="0" y="10" width="110" height="75" fill="#141922" stroke="#2c3647" stroke-width="2" rx="6"/>
    <line x1="20" y1="10" x2="-20" y2="-35" stroke="#718096" stroke-width="3"/>
    <circle cx="35" cy="48" r="22" fill="#0a0e14" stroke="#2c3647" stroke-width="2"/>
    <circle cx="85" cy="35" r="10" fill="#ffb703" opacity="0.6"/>
  </g>
</svg>